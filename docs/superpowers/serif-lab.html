<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serif Lab — half-serif parameter model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0D1A1E;
    --ground-2:#122429;
    --rule:#1E383F;
    --bone:#ECE6DA;
    --bone-dim:#8FA3A6;
    --amber:#E8A33D;
    --cyan:#5FD3D0;
    --pad:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ground);
    color:var(--bone);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    display:grid;
    grid-template-columns:minmax(0,1fr) 372px;
    height:100vh;
  }

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;
    border-right:1px solid var(--rule);
  }
  .stage-head{
    padding:var(--pad) var(--pad) 0;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  h1{
    font-family:"Bodoni Moda",serif;
    font-weight:400;
    font-size:26px;
    letter-spacing:.01em;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }
  .canvas-wrap{flex:1;min-height:0;padding:10px var(--pad) var(--pad);}
  svg.canvas{width:100%;height:100%;display:block;overflow:visible}

  .metric{stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
  .metric-key{stroke:var(--cyan);stroke-opacity:.38;stroke-width:1;vector-effect:non-scaling-stroke}
  .metric-label{
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    fill:var(--bone-dim);letter-spacing:.1em;
  }
  .glyph{fill:var(--bone)}
  .skeleton{stroke:var(--amber);stroke-width:1.5;vector-effect:non-scaling-stroke;fill:none}
  .anchor{fill:var(--ground);stroke:var(--amber);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .frame-axis{stroke:var(--cyan);stroke-width:1.25;vector-effect:non-scaling-stroke;stroke-dasharray:4 4}
  .node{fill:var(--cyan)}
  .handle{stroke:var(--cyan);stroke-opacity:.5;stroke-width:1;vector-effect:non-scaling-stroke}

  .stage-foot{
    padding:0 var(--pad) var(--pad);
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  }
  .toggle{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;background:none;color:var(--bone-dim);
    border:1px solid var(--rule);border-radius:2px;padding:6px 10px;cursor:pointer;
  }
  .toggle[aria-pressed="true"]{color:var(--ground);background:var(--cyan);border-color:var(--cyan)}
  .toggle:focus-visible,.preset:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- panel ---------- */
  .panel{
    background:var(--ground-2);
    overflow-y:auto;
    padding:var(--pad);
    display:flex;flex-direction:column;gap:26px;
  }
  .group{display:flex;flex-direction:column;gap:2px}
  .group > h2{
    font-family:"IBM Plex Mono",monospace;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--cyan);
    padding-bottom:9px;margin-bottom:9px;
    border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .group > h2 em{font-style:normal;color:var(--bone-dim);letter-spacing:.06em;text-transform:none;font-size:10px}

  .ctl{padding:7px 0}
  .ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .ctl label{font-size:12.5px;font-weight:500}
  .ctl .val{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--amber)}
  .ctl .hint{font-size:11px;color:var(--bone-dim);line-height:1.35;margin-top:2px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;background:none;margin-top:7px;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
  input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--bone);margin-top:-6px;border:none;
  }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:var(--bone);border:none;
  }

  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .preset{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
    text-align:left;background:none;color:var(--bone);
    border:1px solid var(--rule);border-radius:2px;padding:8px 9px;cursor:pointer;
  }
  .preset:hover{border-color:var(--amber);color:var(--amber)}
  .preset small{display:block;color:var(--bone-dim);letter-spacing:0;font-size:10px;margin-top:2px}

  .blend-row{display:flex;gap:8px;margin-bottom:4px}
  select{
    flex:1;min-width:0;background:var(--ground);color:var(--bone);
    border:1px solid var(--rule);border-radius:2px;padding:6px 7px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;
  }
  .vector{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.7;
    color:var(--bone-dim);background:var(--ground);
    border:1px solid var(--rule);border-radius:2px;padding:10px;
    white-space:pre-wrap;word-break:break-all;
  }
  .vector b{color:var(--amber);font-weight:400}

  @media (max-width:900px){
    .shell{grid-template-columns:1fr;height:auto}
    .stage{border-right:none;border-bottom:1px solid var(--rule)}
    .canvas-wrap{height:56vh}
    .panel{overflow:visible}
  }
  @media (prefers-reduced-motion:no-preference){
    .glyph{transition:d .08s linear}
  }
</style>
</head>
<body>
<div class="shell">

  <section class="stage">
    <div class="stage-head">
      <h1>Serif Lab</h1>
      <span class="eyebrow">half-serif model · 9 parameters · one topology</span>
    </div>
    <div class="canvas-wrap">
      <svg class="canvas" id="canvas" viewBox="-620 -140 1240 1040" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="stage-foot">
      <button class="toggle" id="tSkeleton" aria-pressed="true">Skeleton</button>
      <button class="toggle" id="tNodes" aria-pressed="false">Nodes</button>
      <button class="toggle" id="tSymmetric" aria-pressed="true">Symmetric halves</button>
      <button class="toggle" id="tOneSided" aria-pressed="false">Right half off</button>
    </div>
  </section>

  <aside class="panel">

    <div class="group">
      <h2>Stem <em>context</em></h2>
      <div id="stemCtls"></div>
    </div>

    <div class="group">
      <h2>Wing <em>extent &amp; tip</em></h2>
      <div id="wingCtls"></div>
    </div>

    <div class="group">
      <h2>Bracket <em>transition into the stem</em></h2>
      <div id="bracketCtls"></div>
    </div>

    <div class="group">
      <h2>Right half <em>asymmetry</em></h2>
      <div id="rightCtls"></div>
    </div>

    <div class="group">
      <h2>Presets</h2>
      <div class="presets" id="presets"></div>
    </div>

    <div class="group">
      <h2>Blend <em>presets are vectors</em></h2>
      <div class="blend-row">
        <select id="blendA"></select>
        <select id="blendB"></select>
      </div>
      <div id="blendCtl"></div>
    </div>

    <div class="group">
      <h2>Parameter vector</h2>
      <div class="vector" id="vector"></div>
    </div>

  </aside>
</div>

<script>
// ---------------------------------------------------------------- parameters
const SPEC = [
  {k:'stemWidth',   g:'stem',    label:'Stem width',        min:40, max:320, step:1, hint:'All serif values are stored ÷ stem width, so weight changes propagate.'},
  {k:'capHeight',   g:'stem',    label:'Cap height',        min:400,max:900, step:1},

  {k:'projection',  g:'wing',    label:'Projection',        min:0,  max:260, step:1, hint:'How far the wing reaches along the terminal axis. 0 = sans.'},
  {k:'tipThickness',g:'wing',    label:'Tip thickness',     min:0,  max:180, step:1, hint:'Serif depth at its outer end. Thick = slab, thin = didone.'},
  {k:'wingSlope',   g:'wing',    label:'Wing slope',        min:-60,max:160, step:1, hint:'Inner corner raised above the tip. Positive gives the old-style rise.'},
  {k:'tipCut',      g:'wing',    label:'Tip cut',           min:-70,max:70,  step:1, hint:'Slant of the outer edge. Positive splays the foot outward.'},
  {k:'underside',   g:'wing',    label:'Underside cup',     min:0,  max:70,  step:1, hint:'Lifts the middle of the foot so only the tips meet the baseline.'},

  {k:'reach',       g:'bracket', label:'Bracket reach',     min:0,  max:320, step:1, hint:'How far up the stem flank the transition starts.'},
  {k:'tension',     g:'bracket', label:'Bracket tension',   min:0,  max:1,   step:.01,hint:'0 pulls the curve to a straight wedge, 1 hugs the inner corner.'},
  {k:'concavity',   g:'bracket', label:'Bracket concavity', min:-1, max:1,   step:.01,hint:'Signed. Negative bulges convex, 0 is a flat chamfer, positive is a classic hollow bracket.'},

  {k:'rProjection', g:'right',   label:'Right projection',  min:0,  max:260, step:1, hint:'Active only when symmetry is off. Set to 0 for one-sided arms.'},
  {k:'rReach',      g:'right',   label:'Right reach',       min:0,  max:320, step:1, hint:'A half with projection 0 but reach > 0 is a pure bracket easing back into the curve — no separate serif type needed.'},
];

const PRESETS = {
  'Sans':        {projection:0,  tipThickness:0,  wingSlope:0,  tipCut:0,  underside:0,  reach:0,   tension:0,   concavity:0},
  'Egyptian':    {projection:130,tipThickness:120,wingSlope:0,  tipCut:0,  underside:0,  reach:26,  tension:.15, concavity:-.05},
  'Clarendon':   {projection:132,tipThickness:76, wingSlope:10, tipCut:0,  underside:0,  reach:140, tension:.9,  concavity:.85},
  'Didone':      {projection:140,tipThickness:26, wingSlope:0,  tipCut:0,  underside:0,  reach:96,  tension:.7,  concavity:.8},
  'Old style':   {projection:112,tipThickness:34, wingSlope:52, tipCut:22, underside:26, reach:150, tension:.62, concavity:.66},
  'Wedge':       {projection:96, tipThickness:12, wingSlope:96, tipCut:0,  underside:0,  reach:40,  tension:.05, concavity:-.18},
};

const P = Object.assign({stemWidth:150, capHeight:700, rProjection:130, rReach:96}, PRESETS['Didone']);
const UI = {skeleton:true, nodes:false, symmetric:true, oneSided:false, blend:0};

// ---------------------------------------------------------------- geometry
const lerp=(a,b,t)=>a+(b-a)*t;
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y);
const mul=(a,s)=>V(a.x*s,a.y*s);
const mix=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t));

/* One half-serif. Local frame: origin at the terminal, +x along the terminal
   axis, +y along the stroke depth. `dir` mirrors it to the other wing.
   Returns the outer profile from the foot centre out to the flank release. */
function halfSerif(dir, projection, reach){
  const sx = P.stemWidth/2;
  const flankX = sx*dir;
  const proj = projection*dir;
  const cut  = P.tipCut*dir;

  const footCentre = V(0,0);
  const tipBottom  = V(flankX + proj + cut, 0);
  const tipTop     = V(flankX + proj, P.tipThickness);
  const corner     = V(flankX, P.tipThickness + P.wingSlope);        // inner corner K
  const release    = V(flankX, P.tipThickness + P.wingSlope + reach); // back on the flank

  // bracket cubic: pull the control points toward a corner displaced by concavity
  const mid = mix(tipTop, release, .5);
  const kc  = add(mid, mul(sub(corner, mid), P.concavity));
  const c1  = mix(tipTop, kc, P.tension);
  const c2  = mix(release, kc, P.tension);

  return {footCentre, tipBottom, tipTop, release, c1, c2,
          cup: V((footCentre.x+tipBottom.x)/2, P.underside*2)};
}

const f=n=>(Math.round(n*100)/100);
const L=p=>`L ${f(p.x)} ${f(p.y)}`;
const C=(a,b,p)=>`C ${f(a.x)} ${f(a.y)} ${f(b.x)} ${f(b.y)} ${f(p.x)} ${f(p.y)}`;
const Q=(a,p)=>`Q ${f(a.x)} ${f(a.y)} ${f(p.x)} ${f(p.y)}`;

function sides(){
  const symmetric = UI.symmetric && !UI.oneSided;
  const rProj = UI.oneSided ? 0 : (symmetric ? P.projection : P.rProjection);
  const rReach= UI.oneSided ? P.rReach : (symmetric ? P.reach : P.rReach);
  return {
    left : halfSerif(-1, P.projection, P.reach),
    right: halfSerif( 1, rProj, rReach),
  };
}

/* Outline of an I: bottom serif, up the flanks, top serif mirrored. */
function outline(){
  const H = P.capHeight;
  const s = sides();
  const up   = (p)=>p;                       // bottom serif, as built
  const down = (p)=>V(p.x, H - p.y);         // top serif, mirrored in y

  const seg = (h, m, forward) => forward
    ? [L(m(h.tipBottom)), L(m(h.tipTop)), C(m(h.c1), m(h.c2), m(h.release))]
    : [C(m(h.c2), m(h.c1), m(h.tipTop)), L(m(h.tipBottom))];

  const d = [];
  d.push(`M 0 0`);
  d.push(Q(up(s.right.cup), up(s.right.tipBottom)).replace(/^Q/,'Q'));
  d.push(L(up(s.right.tipTop)));
  d.push(C(up(s.right.c1), up(s.right.c2), up(s.right.release)));
  d.push(L(down(s.right.release)));
  d.push(...seg(s.right, down, false));
  d.push(Q(down(s.right.cup), V(0,H)));
  d.push(Q(down(s.left.cup), down(s.left.tipBottom)));
  d.push(L(down(s.left.tipTop)));
  d.push(C(down(s.left.c1), down(s.left.c2), down(s.left.release)));
  d.push(L(up(s.left.release)));
  d.push(...seg(s.left, up, false));
  d.push(Q(up(s.left.cup), V(0,0)));
  d.push('Z');
  return {d:d.join(' '), s};
}

// ---------------------------------------------------------------- render
const svg = document.getElementById('canvas');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

function draw(){
  const H = P.capHeight, {d, s} = outline();
  svg.textContent = '';
  const g = el('g', {transform:'scale(1,-1) translate(0,-'+H+')'});

  const reach = 560;
  [[0,'baseline'],[H,'cap height']].forEach(([y,name])=>{
    g.appendChild(el('line',{x1:-reach,y1:y,x2:reach,y2:y,class:'metric-key'}));
  });
  g.appendChild(el('line',{x1:0,y1:-90,x2:0,y2:H+90,class:'metric'}));

  // terminal axis of the bottom serif — the frame the halves hang off
  g.appendChild(el('line',{x1:-reach*.62,y1:0,x2:reach*.62,y2:0,class:'frame-axis'}));

  g.appendChild(el('path',{d, class:'glyph'}));

  if (UI.skeleton){
    g.appendChild(el('line',{x1:0,y1:0,x2:0,y2:H,class:'skeleton'}));
    [0,H].forEach(y=> g.appendChild(el('circle',{cx:0,cy:y,r:9,class:'anchor'})));
  }
  if (UI.nodes){
    [s.left,s.right].forEach(h=>{
      [[h.tipBottom],[h.tipTop],[h.release]].forEach(([p])=>
        g.appendChild(el('circle',{cx:p.x,cy:p.y,r:6,class:'node'})));
      g.appendChild(el('line',{x1:h.tipTop.x,y1:h.tipTop.y,x2:h.c1.x,y2:h.c1.y,class:'handle'}));
      g.appendChild(el('line',{x1:h.release.x,y1:h.release.y,x2:h.c2.x,y2:h.c2.y,class:'handle'}));
      [h.c1,h.c2].forEach(p=> g.appendChild(el('circle',{cx:p.x,cy:p.y,r:4,class:'node'})));
    });
  }
  svg.appendChild(g);

  const labels = el('g');
  [[0,'baseline'],[H,'cap height']].forEach(([y,name])=>{
    const t = el('text',{x:-reach,y:-y-8,class:'metric-label'});
    t.textContent = name.toUpperCase();
    labels.appendChild(t);
  });
  svg.appendChild(labels);

  writeVector();
}

function writeVector(){
  const sw = P.stemWidth;
  const keys = ['projection','tipThickness','wingSlope','tipCut','underside','reach','tension','concavity'];
  const out = keys.map(k=>{
    const norm = (k==='tension'||k==='concavity') ? P[k] : P[k]/sw;
    return `${k.padEnd(13)} <b>${norm.toFixed(3)}</b>`;
  }).join('\n');
  document.getElementById('vector').innerHTML =
    out + `\n\n<span style="color:#5FD3D0">// ÷ stem width ${sw} — same length for every\n// preset, so any two blend linearly.</span>`;
}

// ---------------------------------------------------------------- controls
const inputs = {};
function buildControl(spec, host){
  const wrap = document.createElement('div'); wrap.className = 'ctl';
  const top = document.createElement('div'); top.className = 'ctl-top';
  const lab = document.createElement('label'); lab.textContent = spec.label;
  lab.htmlFor = 'i_'+spec.k;
  const val = document.createElement('span'); val.className = 'val';
  top.append(lab, val);
  const inp = document.createElement('input');
  Object.assign(inp, {type:'range', id:'i_'+spec.k, min:spec.min, max:spec.max, step:spec.step, value:P[spec.k]});
  wrap.append(top, inp);
  if (spec.hint){
    const h = document.createElement('p'); h.className='hint'; h.textContent = spec.hint; wrap.append(h);
  }
  host.append(wrap);
  const show = ()=> val.textContent = (spec.step < 1 ? (+P[spec.k]).toFixed(2) : Math.round(P[spec.k]));
  inp.addEventListener('input', ()=>{ P[spec.k] = parseFloat(inp.value); show(); draw(); });
  inputs[spec.k] = {inp, show};
  show();
}
const hosts = {stem:'stemCtls', wing:'wingCtls', bracket:'bracketCtls', right:'rightCtls'};
SPEC.forEach(s => buildControl(s, document.getElementById(hosts[s.g])));

function syncInputs(){
  for (const k in inputs){ inputs[k].inp.value = P[k]; inputs[k].show(); }
}

// toggles
function toggle(id, key, after){
  const b = document.getElementById(id);
  b.addEventListener('click', ()=>{
    UI[key] = !UI[key];
    b.setAttribute('aria-pressed', UI[key]);
    if (after) after();
    draw();
  });
}
toggle('tSkeleton','skeleton');
toggle('tNodes','nodes');
toggle('tSymmetric','symmetric');
toggle('tOneSided','oneSided');

// presets
const presetHost = document.getElementById('presets');
Object.entries(PRESETS).forEach(([name, vec])=>{
  const b = document.createElement('button');
  b.className='preset';
  b.innerHTML = name + '<small>' + (vec.projection===0 ? 'no wing' :
    vec.concavity<0 ? 'convex transition' :
    vec.tipThickness>90 ? 'unbracketed slab' :
    vec.wingSlope>60 ? 'wedge, minimal bracket' :
    vec.wingSlope>20 ? 'sloped, cupped foot' :
    vec.tipThickness>50 ? 'thick tip, deep bracket' : 'thin tip, deep bracket') + '</small>';
  b.addEventListener('click', ()=>{ Object.assign(P, vec); syncInputs(); draw(); });
  presetHost.append(b);
});

// blend
const names = Object.keys(PRESETS);
const selA = document.getElementById('blendA'), selB = document.getElementById('blendB');
names.forEach(n=>{
  selA.append(new Option(n,n));
  selB.append(new Option(n,n));
});
selA.value = 'Egyptian'; selB.value = 'Didone';
buildControl({k:'blend', label:'A → B', min:0, max:1, step:.01,
  hint:'Every preset is the same 8 numbers, so a blend is a straight lerp. This is the payoff for refusing discrete serif types.'},
  document.getElementById('blendCtl'));
inputs.blend.inp.value = 0;

function applyBlend(){
  const a = PRESETS[selA.value], b = PRESETS[selB.value], t = UI.blend;
  for (const k in a) P[k] = lerp(a[k], b[k], t);
  syncInputs();
  draw();
}
inputs.blend.inp.addEventListener('input', e=>{
  UI.blend = parseFloat(e.target.value);
  document.querySelector('#blendCtl .val').textContent = UI.blend.toFixed(2);
  applyBlend();
});
selA.addEventListener('change', applyBlend);
selB.addEventListener('change', applyBlend);

draw();
</script>
</body>
</html>
